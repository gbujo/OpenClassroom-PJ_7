name: Predict API GCloud Build and Deploy

on:
  push:
    branches:
      - main
      - dashboard

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

# Pytest
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9' # Spécifiez votre version de Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project_predict/predict/requirements.txt

    - name: Run tests with pytest
      run: |
        pytest project_predict/tests/ # Exécute les tests dans le dossier tests/

# Fin Pytest

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
# pas besoin de passer service_account_key car l'authentification est faite dans auth@v1
#        project_id: nimble-willow-448418-q0
#        service_account_key: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

    - name: Run Cloud Build
      run: |
        gcloud builds submit --region=europe-west1 \
        --tag europe-west9-docker.pkg.dev/nimble-willow-448418-q0/predict-docker-repo/predict-image:tag1 project_predict/predict/.

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy apipredict \
        --image europe-west9-docker.pkg.dev/nimble-willow-448418-q0/predict-docker-repo/predict-image:tag1 \
        --region europe-west9 --platform managed --allow-unauthenticated
